<section id="page-set" class="page">
  <div class="input">
    <label>Set A <input id="set-a" placeholder="e.g. 1, 2, 3 (commas or spaces)" autocomplete="off"></label>
    <label>Set B <input id="set-b" placeholder="e.g. 3, 4" autocomplete="off"></label>
    <button id="set-run">Run</button>
  </div>

  <div class="input" style="margin-top:0">
    <label>Expression
      <input id="set-expr" placeholder="e.g. (A u B) Δ A" autocomplete="off">
    </label>
    <p class="hint small">Sets: A, B &nbsp;|&nbsp; Union: u ∪ + &nbsp;|&nbsp; Intersection: n ∩ * &nbsp;|&nbsp; Difference: - \ &nbsp;|&nbsp; Sym. diff: Δ d ^</p>
    <div id="set-expr-out"><p class="hint">Type an expression using A and B.</p></div>
  </div>

  <div id="set-output"><p class="hint">Enter two sets and press Run.</p></div>
</section>
