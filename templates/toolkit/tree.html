<section id="page-tree" class="page active">
  <p class="hint">Type an <strong>infix</strong> expression (e.g. <code>A+B/D-E</code>) and press Enter (or Build). Then choose which traversal to show &mdash; switching the output updates instantly.</p>
  <p id="tree-error" role="alert"></p>

  <div class="tree-controls">
    <div class="tree-entry">
      <input id="tree-input" placeholder="A+B/D-E" aria-label="Infix expression">
      <button type="button" id="tree-build">Build</button>
    </div>
  </div>

  <div class="tree-controls">
    <span class="tree-label">Show output as</span>
    <div class="tree-switch" role="group" aria-label="Output traversal">
      <button type="button" data-output="prefix">Preorder</button>
      <button type="button" data-output="infix">Inorder</button>
      <button type="button" data-output="postfix">Postorder</button>
    </div>
  </div>

  <div class="tree-head">
    <h3 id="tree-title">Postorder (postfix) <small>Left → Right → Root</small></h3>
  </div>
  <div id="tree-output" class="tree-output"></div>
  <div class="tree" id="tree-draw"></div>
</section>
