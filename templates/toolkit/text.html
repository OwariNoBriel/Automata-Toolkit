<section id="page-text" class="page">
  <div class="text-tool">
    <div class="card">
      <div class="field"><label for="textA">Text A</label><input id="textA" autocomplete="off"></div>
      <div class="field"><label for="textB">Text B</label><input id="textB" autocomplete="off"></div>

      <div class="btn-row" id="ops">
        <button data-op="concat">Concat (+ B)</button>
        <button data-op="reverse">Reverse</button>
        <button data-op="upper">Uppercase</button>
        <button data-op="lower">Lowercase</button>
      </div>
      <div class="btn-row">
        <button id="undo" class="ghost">Undo</button>
        <button id="reset" class="ghost">Reset</button>
      </div>
    </div>

    <div class="card">
      <h3>Steps</h3>
      <table id="steps"></table>
    </div>

    <div class="card">
      <h3>Result</h3>
      <div class="kv"><span>Current</span><b id="outCurrent"></b></div>
      <div class="kv"><span>Length</span><b id="outLength"></b></div>
      <div class="kv"><span>Prefixes</span><b id="outPrefixes"></b></div>
      <div class="kv"><span>Suffixes</span><b id="outSuffixes"></b></div>
      <div class="kv"><span>Palindrome</span><b id="outPal"></b></div>
    </div>

    <div class="card">
      <h3>Notation converter</h3>
      <div class="field">
        <label for="convMode">Conversion</label>
        <select id="convMode">
          <option value="post-in">Suffix (postfix) → Infix</option>
          <option value="in-pre">Infix → Prefix</option>
          <option value="pre-post">Prefix → Suffix (postfix)</option>
        </select>
      </div>
      <div class="field"><label for="convIn">Expression</label><input id="convIn" autocomplete="off"></div>
      <div class="kv"><span>Result</span><b id="convOut"></b></div>
      <div id="convErr" class="err"></div>
    </div>
  </div>
</section>
