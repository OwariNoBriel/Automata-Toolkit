<section id="page-text" class="page">
  <div class="text-tool">
    <div class="card">
      <div class="field"><label for="textA">Text A</label><input id="textA" autocomplete="off"></div>
      <div class="field"><label for="textB">Text B</label><input id="textB" autocomplete="off"></div>

      <div class="field">
        <label for="textOut">Output (Text A)</label>
        <div id="textOut" class="out-box" aria-live="polite"></div>
      </div>

      <div class="btn-row" id="ops">
        <button data-op="concat">Concat (+ B)</button>
        <button data-op="reverse">Reverse</button>
        <button data-op="upper">Uppercase</button>
        <button data-op="lower">Lowercase</button>
        <button data-op="prefixes">Prefixes</button>
        <button data-op="suffixes">Suffixes</button>
      </div>
      <div class="btn-row">
        <button id="undo" class="ghost">Undo</button>
        <button id="reset" class="ghost">Reset</button>
      </div>

      <div id="textInfo" class="info-box" hidden></div>
    </div>
  </div>
</section>
